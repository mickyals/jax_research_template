# tc_classifier.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Experiment: sparse_obs_cross_attn — ordinal TC intensity classifier.
#
# Run:
#   python src/experiments/sparse_obs_cross_attn/train.py
#   python src/experiments/sparse_obs_cross_attn/train.py --resume
#
# Evaluate:
#   python src/experiments/sparse_obs_cross_attn/evaluate.py \
#       --config src/experiments/sparse_obs_cross_attn/configs/tc_classifier.yaml \
#       --ckpt   checkpoints/tc_classifier/best
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# Data  (update paths before running)
# ─────────────────────────────────────────────────────────────────────────────
data:
  # ibtracs_full.npz is preferred for the ordinal classifier — it retains all
  # status types (EX, ET, DS, SS, SD etc.) which populate the disturbance and
  # subtropical classes and give the model a complete view of the TC lifecycle.
  # Rows with NaN or unmapped SSHS are skipped automatically at sample time.
  # Use ibtracs_tc_clean.npz only if you want to restrict to confirmed TC rows.
  ibtracs_path:        data/ibtracs_full.npz
  multi_storm_path:    data/ibtracs_multi_storm_times.npz   # set to null to skip
  insitu_obs_path:     data/insitu_land_clean.npz
  insitu_meta_path:    data/insitu_land_station_meta.npz

  reliability_levels:  [always_active, mostly_active]

  radius_km:           500.0
  # ± hours around the storm timestamp.
  # 0.0 = exact nanosecond match only — will produce empty batches in practice
  # because IBTrACS and in-situ timestamps are on different grids.
  # Minimum recommended: 0.5.  Default 3.0 matches IBTrACS 3-hourly cadence.
  time_window_hours:   3.0

  max_stations:        64        # pad / subsample context set to this size
  min_stations:        1         # skip samples with fewer real stations

  batch_size:          64        # total; half TC, half background per batch

  fov_lat:             [0.0, 30.0]
  fov_lon:             [-100.0, -45.0]

  background_buffer_hours: 3.0   # exclude insitu timestamps within ± this of any TC obs
                                 # 3.0 matches IBTrACS 3-hourly cadence: one record interval

  # TC:background balance per batch. 0.5 = equal halves (32 TC + 32 background for batch_size=64).
  # Set slightly below 0.5 (e.g. 0.4) to oversample background and reinforce the no-storm
  # base rate, which is the dominant class in the real world.
  tc_fraction: 0.5


# ─────────────────────────────────────────────────────────────────────────────
# Model  (TCClassifier)
# ─────────────────────────────────────────────────────────────────────────────
model:
  embed_dim:    128
  num_heads:    4
  n_layers:     2
  mlp_ratio:    4.0
  dropout_rate: 0.1
  n_classes:    10      # ordinal classes 0..9
  pos_map_dim:  64      # GaussianFourierEmbedding output dim (must be even)
  pos_scale:    10.0    # Gaussian frequency matrix std dev


# ─────────────────────────────────────────────────────────────────────────────
# Trainer
# ─────────────────────────────────────────────────────────────────────────────
trainer:
  loss_key:        ordinal_loss
  num_epochs:      100
  patience:        15
  patience_metric: val/ordinal_loss

  optimizer:       adamw
  optimizer_kwargs:
    weight_decay:  0.01

  scheduler:       cosine_decay
  scheduler_kwargs:
    init_value:    3.0e-4
    decay_steps:   50000    # ~n_tc_train / (batch_size/2) * num_epochs

  max_grad_norm:   1.0

  checkpoint_dir:    checkpoints/tc_classifier
  log_every_n_steps: 100
  seed:              42

  # Logging — WandB (primary)
  log_backend: wandb
  log_kwargs:
    project:  tc-classifier
    name:     null          # auto-generated by WandB if null
    tags:     [ordinal, cross-attention, sparse-obs]
    # offline: true         # uncomment to log offline and sync later

  # Logging — TensorBoard fallback (comment out wandb block and use this)
  # log_backend: tensorboard
  # log_kwargs: {}

  # Logging — no external dependency (tests / dry runs)
  # log_backend: null
