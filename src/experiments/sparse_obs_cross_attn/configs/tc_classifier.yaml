# Single seed propagated to Trainer (model init, dropout) and TCLoader (shuffle).
seed: 3678

data:
  ibtracs_path:           E:/sparse_obs/ibtracs/ibtracs_full.npz
  multi_storm_path:       E:/sparse_obs/ibtracs/ibtracs_multi_storm_times.npz
  insitu_obs_path:        E:/sparse_obs/insitu-land/insitu_land_clean.npz
  insitu_meta_path:       E:/sparse_obs/insitu-land/insitu_land_station_meta.npz

  reliability_levels:     [always_active, mostly_active]

  obs_vars:
    - air_pressure_at_sea_level
    - air_temperature
    - dew_point_temperature
    - wind_speed
    - wind_from_direction

  radius_km:              500.0
  time_window_hours:      0.1

  max_stations:           64
  min_stations:           1

  batch_size:             64
  tc_fraction:            0.5

  fov_lat:                [0.0, 30.0]
  fov_lon:                [-100.0, -45.0]

  background_buffer_hours: 6.0

  # --- Coordinate encoding ---
  # 'unit_circle': station_coords = [norm_distance, bearing_rad], query = learned CLS token
  # 'domain':      station_coords = [norm_lat_rad, norm_lon_rad], query = Fourier-encoded
  location_encoding:      unit_circle

  # --- Observation normalization ---
  # 'minmax_01': normalize to [0, 1]   using [min, max] bounds per variable
  # 'minmax_11':   normalize to [-1, 1]  using [min, max] bounds per variable
  # 'standardise': z-score using [mean, std] per variable
  obs_normalisation:      minmax_11

  # Physical bounds per variable — fill in once confirmed from Copernicus/NOAA docs
  # Units must match the raw obs data (Pa for pressure, K for temperature, m/s for wind)
  obs_bounds:
    air_pressure_at_sea_level: [87000.0, 108400.0]   # Pa  (870–1084 hPa)
    air_temperature:           [193.0,   333.0]        # K   (-80°C to +60°C)
    dew_point_temperature:     [193.0,   308.0]        # K   (-80°C to +35°C)
    wind_speed:                [0.0,     115.0]         # m/s (~224 kt max observed)
    wind_from_direction:       [0.0,     360.0]         # degrees

model:
  # Must match data.location_encoding — controls query token construction
  # 'unit_circle' → learned CLS token; 'domain' → Fourier-encoded query
  location_encoding:    unit_circle

  # --- Token dimensionality ---
  embed_dim:            128
  num_heads:            4

  # Total encoder layers (unified self-attention over station + query tokens)
  num_layers:           4

  # --- FFN ---
  mlp_ratio:            4.0
  mlp_activation:       gelu
  mlp_initializer:      xavier_uniform

  # --- Regularisation ---
  dropout_rate:         0.0
  attn_dropout_rate:    0.0

  # --- Coordinate embedding ---
  fourier_dim:          64      # GaussianFourierEmbedding output dim (must be even)
  fourier_scale:        1.0     # Gaussian frequency spread

  # --- Missing observation handling ---
  # True  = learned mask token (normal init, stddev 0.02) — recommended
  # False = constant scalar sentinel (missing_value)
  use_learned_mask:     true

  # --- Output ---
  # n_obs_features must match len(data.obs_vars)
  n_obs_features:       5
  n_classes:            11      # 0 = no storm, 1–10 = SSHS −4 to +5

  # Init value for learned mask token (use_learned_mask: true) and constant sentinel
  # (use_learned_mask: false). Moderate negative — gives the model a clear "absent" prior.
  missing_value:        -10.0

trainer:
  # batch_size must match data.batch_size — Trainer stores it for reference
  batch_size:           64

  # --- Optimiser ---
  optimizer:            adamw
  optimizer_kwargs:
    weight_decay:       1.0e-4

  # --- Learning rate schedule ---
  # Linear warmup for 500 steps then cosine decay to near-zero
  scheduler:            warmup_cosine
  scheduler_kwargs:
    init_value:         0.0
    peak_value:         1.0e-4
    warmup_steps:       500
    decay_steps:        50000
    end_value:          1.0e-6

  # --- Loop ---
  num_epochs:           100
  num_steps:            .inf          # no step budget — epoch limit only

  # --- Early stopping ---
  patience:             15
  patience_metric:      val/cross_entropy
  patience_direction:   lower_is_better

  # --- Gradient clipping ---
  max_grad_norm:        1.0

  # --- Run directory ---
  # All artifacts (checkpoints, logs, WandB local files) go under run_dir.
  # Set a unique path per experiment run.
  #   run_dir/checkpoints/best|latest   — orbax pytrees
  #   run_dir/logs/                     — hparams.json, figures/, WandB files
  # If run_dir is set, checkpoint_dir is ignored.
  run_dir:              runs/tc_classifier/run_01

  # --- Logging ---
  # 'wandb' | 'tensorboard' | 'null'
  log_backend: wandb
  log_every_n_steps:    50
  # WandB — uncomment and fill in when switching to remote logging:
  log_kwargs:
    project:  sparse_obs_encoding
    name:     unified-transformer-unit-circle-run1
    offline:  false
    tags:     [unit_circle, unified_transformer]

  # seed is injected from top-level seed by train.py — no need to set here
