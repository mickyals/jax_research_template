# =============================================================================
# TC Classifier -- hyperparameter search configuration
#
# Use this config with tune.py to find the best architecture and training HPs.
# Once the best params are found, copy them into tc_classifier.yaml and run a
# full-length training with train.py.
#
# What this file controls vs. what tune.py controls
# --------------------------------------------------
# This file:  search_space ranges/choices, base config values, data paths,
#             tuning loop settings (num_epochs, patience, log_backend).
# tune.py:    the MAPPING from HP names to config paths (suggest_fn).
#             Change suggest_fn when the model architecture changes; change
#             this file when you want to widen or narrow a search range.
# =============================================================================

# Experiment-wide shared values -- propagated to data: and model: by tune.py.
seed: 982

# Coordinate encoding -- set once here, injected into data: and model:.
# unit_circle  station_coords = [x, y] storm-centred local map
#              (norm_dist·sin(bearing), norm_dist·cos(bearing))
# domain       station_coords = [norm_lat_rad, norm_lon_rad] absolute position
location_encoding:  unit_circle


# =============================================================================
# Search space
# =============================================================================
# Each key is an HP name that suggest_fn maps to a config path.
# Types:
#   float       low, high, log (optional bool)
#   int         low, high
#   categorical choices (list)
#
# To add a new HP: add an entry here AND add the mapping in tune.py suggest_fn.
# To change a range: edit this file only -- no Python changes needed.
# =============================================================================

search_space:

  # --- Learning rate ---
  peak_value:
    type:  float
    low:   1.0e-5
    high:  1.0e-3
    log:   true

  # --- Optimiser regularisation ---
  weight_decay:
    type:  float
    low:   1.0e-6
    high:  1.0e-2
    log:   true

  # --- Dropout ---
  dropout_rate:
    type:  float
    low:   0.0
    high:  0.7

  attn_dropout_rate:
    type:  float
    low:   0.0
    high:  0.3

  # --- Token width: embed_dim = num_heads x dim_per_head (always divisible) ---
  num_heads:
    type:    categorical
    choices: [2, 4, 8]

  dim_per_head:
    type:    categorical
    choices: [16, 32, 64]

  # --- Encoder depth ---
  num_layers:
    type:  int
    low:   1
    high:  6

  # --- Coordinate embedding ---
  fourier_dim:
    type:    categorical
    choices: [32, 64, 128]

  fourier_scale:
    type:  float
    low:   0.1
    high:  10.0
    log:   true


# =============================================================================
# Base config  (non-searched fields; overridden per trial only where noted)
# =============================================================================

# -----------------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------------
data:

  # --- Source files ---
  ibtracs_path:           E:/sparse_obs/ibtracs/ibtracs_full.npz
  multi_storm_path:       E:/sparse_obs/ibtracs/ibtracs_multi_storm_times.npz
  ibtracs_sid_meta_path:  E:/sparse_obs/ibtracs/ibtracs_sid_meta.npz
  insitu_obs_path:        E:/sparse_obs/insitu-land/insitu_land_clean.npz
  insitu_meta_path:       E:/sparse_obs/insitu-land/insitu_land_station_meta.npz

  # --- Prediction target (see data/targets.TARGET_SCHEMA) ---
  target:                 organisation

  # --- Train/val/test split ---
  # Independent of tc_classifier.yaml's split. Splits are by ISO_TIME calendar
  # year (strategy 'year'; see data/splits.py). Re-tune or re-train the chosen
  # config at full length once the split policy is finalised.
  split:
    strategy: year
    train:
      years: [2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014,
              2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022]
    val:
      years: [2023, 2024]
    test:
      years: [2025]
      hard_test: multi_storm

  # --- Station filtering ---
  reliability_levels:     [always_active, mostly_active, sporadic, sparse, unusable]
  radius_km:              500.0
  time_window_hours:      0.1

  # --- Observed variables ---
  # wind_east/wind_north are DERIVED from wind_speed + wind_from_direction
  # by TCDataset (see tc_classifier.yaml for rationale).
  obs_vars:
    - air_pressure_at_sea_level
    - air_temperature
    - dew_point_temperature
    - wind_east
    - wind_north

  # --- Observation normalisation ---
  obs_normalisation:      minmax_11
  obs_bounds:
    air_pressure_at_sea_level: [87000.0, 105000.0]
    air_temperature:           [193.0,   333.0]
    dew_point_temperature:     [193.0,   308.0]
    wind_east:                 [-115.0,  115.0]
    wind_north:                [-115.0,  115.0]

  # --- Token padding / truncation ---
  # All stations within radius used; >max_stations → nearest-trim (no random).
  max_stations:           16
  min_stations:           1

  # --- Batch construction ---
  # batch_size is set in trainer: and propagated here by tune.py.
  tc_fraction:            0.5         # 50/50 balanced for tuning

  # Class weighting from train-split counts (see tc_classifier.yaml):
  # none | inverse_freq | sqrt_inverse_freq | effective_number | median_freq
  class_weight_scheme:    none
  class_weight_beta:      0.999

  # --- Domain ---
  fov_lat:                [0.0,  30.0]
  fov_lon:                [-100.0, -45.0]
  background_buffer_hours: 6.0

  # --- Coordinate encoding ---
  # Set at top level -- propagated here by tune.py. Do not set in this block.


# -----------------------------------------------------------------------------
# Model  (base values -- most overridden per trial by suggest_fn)
# -----------------------------------------------------------------------------
model:

  # --- Fixed across all trials ---
  missingness_indicator: true  # concat obs_mask as its own channel (missing obs filled 0)
  full_self_attention:  true   # false = asymmetric mask; true = complete self-attention
  n_obs_features:       5
  n_classes:            9    # ordinal organisation scale (ibtracs.CLASS_NAMES)
  mlp_ratio:            4.0
  mlp_activation:       gelu
  mlp_initializer:      xavier_uniform

  # --- Overridden per trial by suggest_fn (base values here are placeholders) ---
  embed_dim:            128
  num_heads:            4
  num_layers:           4
  dropout_rate:         0.0
  attn_dropout_rate:    0.0
  fourier_dim:          64
  fourier_scale:        1.0


# -----------------------------------------------------------------------------
# Trainer  (tuning-specific settings -- shorter runs, no remote logging)
# -----------------------------------------------------------------------------
trainer:

  # Single source of truth for batch size -- propagated to data: by tune.py.
  batch_size:           64

  # --- Optimiser (peak_value and weight_decay overridden per trial) ---
  optimizer:            adamw
  optimizer_kwargs:
    weight_decay:       1.0e-4

  # --- Learning rate schedule (peak_value overridden per trial) ---
  scheduler:            warmup_cosine
  scheduler_kwargs:
    init_value:         0.0
    peak_value:         1.0e-4
    warmup_steps:       200           # shorter warmup for quick trials
    decay_steps:        10000
    end_value:          1.0e-6

  # --- Tuning loop ---
  # Short epochs so the pruner can cut bad trials quickly.
  # Re-train the best config at full length using tc_classifier.yaml.
  num_epochs:           30
  num_steps:            .inf

  # Steps per training epoch (random TC sampling mode).
  steps_per_epoch:      1000

  # --- Loss ---
  # Fixed for this sweep (not a suggest_fn dimension yet). See
  # training/losses.py LOSSES registry; cross_entropy composes focal_gamma +
  # class_weights via loss_kwargs.
  loss:                 cross_entropy
  loss_kwargs:          {}

  # Reported metrics (METRICS registry). cross_entropy is the patience metric +
  # comparability anchor — keep it listed.
  metrics:              [cross_entropy, binary_accuracy, mae_class]

  # --- Early stopping ---
  patience:             8
  patience_metric:      val/cross_entropy
  patience_direction:   lower_is_better

  # No per-trial diagnostics row during the HP search (keeps trials lean).
  diagnostics:          false

  # --- Gradient clipping ---
  max_grad_norm:        1.0

  # --- Run directory ---
  # Relative paths resolved against the experiment directory
  # (sparse_obs_cross_attn/, two levels above train/tune.py).
  run_dir:              runs/tc_classifier/hp_search-random-station-radius

  # --- Logging ---
  # NullLogger during tuning -- no remote logging overhead per trial.
  # Scalar metrics are printed to stdout; figures saved to disk.
  # NOTE: quoted "null" — create_logger expects the string, not YAML null
  # (which parses to None and would crash backend.lower()).
  log_backend:          "null"
  log_every_n_steps:    50
  log_kwargs:           {}

  # seed is injected from the top-level seed by tune.py.
