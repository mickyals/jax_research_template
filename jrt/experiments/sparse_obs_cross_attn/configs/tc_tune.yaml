# =============================================================================
# TC Classifier -- hyperparameter search configuration
#
# Use this config with tune.py to find the best architecture and training HPs.
# Once the best params are found, copy them into tc_classifier.yaml and run a
# full-length training with train.py.
#
# What this file controls vs. what tune.py controls
# --------------------------------------------------
# This file:  search_space ranges/choices, base config values, data paths,
#             tuning loop settings (num_epochs, patience, log_backend).
# tune.py:    the MAPPING from HP names to config paths (suggest_fn).
#             Change suggest_fn when the model architecture changes; change
#             this file when you want to widen or narrow a search range.
# =============================================================================

# Experiment-wide shared values -- propagated to data: and model: by tune.py.
seed: 42

# Coordinate encoding -- set once here, injected into data: and model:.
# unit_circle  station_coords = [norm_distance, bearing_rad] relative to query
# domain       station_coords = [norm_lat_rad, norm_lon_rad] absolute position
location_encoding:  unit_circle


# =============================================================================
# Search space
# =============================================================================
# Each key is an HP name that suggest_fn maps to a config path.
# Types:
#   float       low, high, log (optional bool)
#   int         low, high
#   categorical choices (list)
#
# To add a new HP: add an entry here AND add the mapping in tune.py suggest_fn.
# To change a range: edit this file only -- no Python changes needed.
# =============================================================================

search_space:

  # --- Learning rate ---
  peak_value:
    type:  float
    low:   1.0e-5
    high:  1.0e-3
    log:   true

  # --- Optimiser regularisation ---
  weight_decay:
    type:  float
    low:   1.0e-6
    high:  1.0e-2
    log:   true

  # --- Dropout ---
  dropout_rate:
    type:  float
    low:   0.0
    high:  0.4

  attn_dropout_rate:
    type:  float
    low:   0.0
    high:  0.3

  # --- Token width: embed_dim = num_heads x dim_per_head (always divisible) ---
  num_heads:
    type:    categorical
    choices: [2, 4, 8]

  dim_per_head:
    type:    categorical
    choices: [16, 32, 64]

  # --- Encoder depth ---
  num_layers:
    type:  int
    low:   1
    high:  6

  # --- Coordinate embedding ---
  fourier_dim:
    type:    categorical
    choices: [32, 64, 128]

  fourier_scale:
    type:  float
    low:   0.1
    high:  10.0
    log:   true


# =============================================================================
# Base config  (non-searched fields; overridden per trial only where noted)
# =============================================================================

# -----------------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------------
data:

  # --- Source files ---
  ibtracs_path:           E:/sparse_obs/ibtracs/ibtracs_full.npz
  multi_storm_path:       E:/sparse_obs/ibtracs/ibtracs_multi_storm_times.npz
  insitu_obs_path:        E:/sparse_obs/insitu-land/insitu_land_clean.npz
  insitu_meta_path:       E:/sparse_obs/insitu-land/insitu_land_station_meta.npz

  # --- Station filtering ---
  reliability_levels:     [always_active, mostly_active]
  radius_km:              500.0
  time_window_hours:      0.1

  # --- Observed variables ---
  obs_vars:
    - air_pressure_at_sea_level
    - air_temperature
    - dew_point_temperature
    - wind_speed
    - wind_from_direction

  # --- Observation normalisation ---
  obs_normalisation:      minmax_11
  obs_bounds:
    air_pressure_at_sea_level: [87000.0, 108400.0]
    air_temperature:           [193.0,   333.0]
    dew_point_temperature:     [193.0,   308.0]
    wind_speed:                [0.0,     115.0]
    wind_from_direction:       [0.0,     360.0]

  # --- Token padding / truncation ---
  max_stations:           64
  min_stations:           1

  # --- Batch construction ---
  # batch_size is set in trainer: and propagated here by tune.py.
  tc_fraction:            0.5         # 50/50 balanced for tuning

  # --- Domain ---
  fov_lat:                [0.0,  30.0]
  fov_lon:                [-100.0, -45.0]
  background_buffer_hours: 6.0

  # --- Coordinate encoding ---
  # Set at top level -- propagated here by tune.py. Do not set in this block.


# -----------------------------------------------------------------------------
# Model  (base values -- most overridden per trial by suggest_fn)
# -----------------------------------------------------------------------------
model:

  # location_encoding is set at top level -- propagated here by tune.py.

  # --- Fixed across all trials ---
  use_learned_mask:     true
  missing_value:        -10.0
  n_obs_features:       5
  n_classes:            11
  mlp_ratio:            4.0
  mlp_activation:       gelu
  mlp_initializer:      xavier_uniform

  # --- Overridden per trial by suggest_fn (base values here are placeholders) ---
  embed_dim:            128
  num_heads:            4
  num_layers:           4
  dropout_rate:         0.0
  attn_dropout_rate:    0.0
  fourier_dim:          64
  fourier_scale:        1.0


# -----------------------------------------------------------------------------
# Trainer  (tuning-specific settings -- shorter runs, no remote logging)
# -----------------------------------------------------------------------------
trainer:

  # Single source of truth for batch size -- propagated to data: by tune.py.
  batch_size:           64

  # --- Optimiser (peak_value and weight_decay overridden per trial) ---
  optimizer:            adamw
  optimizer_kwargs:
    weight_decay:       1.0e-4

  # --- Learning rate schedule (peak_value overridden per trial) ---
  scheduler:            warmup_cosine
  scheduler_kwargs:
    init_value:         0.0
    peak_value:         1.0e-4
    warmup_steps:       200           # shorter warmup for quick trials
    decay_steps:        10000
    end_value:          1.0e-6

  # --- Tuning loop ---
  # Short epochs so the pruner can cut bad trials quickly.
  # Re-train the best config at full length using tc_classifier.yaml.
  num_epochs:           30
  num_steps:            .inf

  # Steps per training epoch (random TC sampling mode).
  steps_per_epoch:      1000

  # --- Early stopping ---
  patience:             8
  patience_metric:      val/cross_entropy
  patience_direction:   lower_is_better

  # --- Gradient clipping ---
  max_grad_norm:        1.0

  # --- Run directory ---
  # Relative paths resolved against the experiment directory
  # (sparse_obs_cross_attn/, two levels above train/tune.py).
  run_dir:              runs/tc_classifier/hp_search

  # --- Logging ---
  # NullLogger during tuning -- no remote logging overhead per trial.
  # Scalar metrics are printed to stdout; figures saved to disk.
  log_backend:          null
  log_every_n_steps:    50
  log_kwargs:           {}

  # seed is injected from the top-level seed by tune.py.
