# =============================================================================
# cyclone_jax TRAIN config — THE entry point
# =============================================================================
# Points at one data scenario + one model config; the only call from a
# notebook/CLI is train with this file. config.load_config resolves the
# pointers and validates every block.
#
# First goal = the memorisation gate: data overfit, regularisation OFF,
# drive train loss -> 0.

data: overfit                     # -> configs/data/<name>.yaml
model: mlp                        # -> configs/models/<name>.yaml

trainer:
  seed: 0                         # populates jax model init AND data order

  # loss: a registered name (+ loss_kwargs), or a weighted term list —
  #   loss:
  #     - {name: cross_entropy, kwargs: {focal_gamma: 2.0}}
  #     - {name: l1_params, weight: 1.0e-4}   # model term; weight 0 = monitor
  # Terms resolve against jrt LOSSES/MODEL_TERMS; with a list, per-term
  # curves are logged as train/loss/<term> and loss_kwargs must stay empty.
  loss: cross_entropy
  loss_kwargs: {}

  optimizer: adamw
  optimizer_kwargs:
    weight_decay: 0.0             # OFF for the memorisation gate

  scheduler: constant
  scheduler_kwargs:
    value: 1.0e-3

  num_epochs: 100
  check_val_every_n_epoch: 1
  gradient_clip: 1.0

  # Early stopping watches TRAIN loss during the memorisation gate
  patience: 50
  patience_metric: train/loss

  metrics: [cross_entropy, binary_accuracy, mae_class]

  logger: wandb                   # wandb | tensorboard | "null"
  run_dir: jrt/experiments/cyclone_jax/runs/dev   # gitignored (**/runs/)
