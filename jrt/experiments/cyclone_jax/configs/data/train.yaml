# =============================================================================
# cyclone_jax data scenario: TRAIN — full year-split training
# =============================================================================
# THE generalisation scenario: disjoint year lists over the library's
# 2005-2024 coverage (2025 = the land-only diagnostic year, out — same
# ruling as memorise_2005_2024). Fixes at multi-driver timestamps are
# EXCLUDED (ambiguous supervision) — they form the multistorm.yaml OOD
# scenario. NOTE the test ceiling means something different here:
# input_collisions counts conflicts WITHIN the split, but a test fix
# whose weather picture also occurred in training carries its label
# boundary — flag when reporting.

root: "E:/Caribbean-Obs"          # shell CYCLONE_JAX_ROOT overrides

sources: [land, marine]           # variants: train_land / train_marine
# explicit channel list = the sources' full union (the run-record
# default); trim it to ablate variables. Per-source absence (e.g.
# sst on land) stays NaN + missing-flag — no per-source selection.
channels: [station_pressure, slp, air_temp, dewpoint, sst,
           u_wind, v_wind]
selection: all
max_stations: null
pad_to: 1536

target: usa_sshs
sshs_min: 3
class_set: [3, 4, 5, 6, 7, 8]
drop_subtropical: false

source_id: {land: -1, upper: 0, marine: 1}
timesteps: 1

batch_size: 32

# TRAIN-stream multiprocess assembly (see memorise.yaml for the knobs'
# semantics). 0 = synchronous; >0 for Linux/fork multi-CPU boxes.
num_workers: 0                    # shell CYCLONE_JAX_NUM_WORKERS overrides
prefetch_factor: 2

split:
  strategy: year
  exclude_multistorm: true
  years:                          # 14 / 3 / 3 seasons over 2005-2024
    train: [2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014,
            2015, 2016, 2017, 2018]
    val:  [2019, 2020, 2021]
    test: [2022, 2023, 2024]      # holds Ian 2022 + Beryl 2024

tags: [year-split, generalise]    # -> wandb, with model tags

storm_panels:
  train: random
  val: random
  test:                           # end-of-run sequences from TEST years
    - "2024181N09320"             # BERYL 2024
    - "2022266N12294"             # IAN 2022

normalise:
  method: standardise
  stats: auto                     # computed over THIS train split, saved
                                  # to run_dir/norm_stats.json
