# =============================================================================
# cyclone_jax data scenario: TEST — held-out-years evaluation passes
# =============================================================================
# Same split as train.yaml (keep the year lists in sync); use with an
# evaluation entry point that iterates streams['test'] only. Sequential,
# partial batch kept (interface val/test stream defaults).
# !! EDIT the year lists to the library's real coverage (match train.yaml).

root: "E:/Caribbean-Obs"

sources: [land, marine]
# explicit channel list = the sources' full union (the run-record
# default); trim it to ablate variables. Per-source absence (e.g.
# sst on land) stays NaN + missing-flag — no per-source selection.
channels: [station_pressure, slp, air_temp, dewpoint, sst,
           u_wind, v_wind]
selection: all
max_stations: null
pad_to: 1536

target: usa_sshs
sshs_min: 3
class_set: [3, 4, 5, 6, 7, 8]
drop_subtropical: false

source_id: {land: -1, upper: 0, marine: 1}
timesteps: 1

batch_size: 32
split:
  strategy: year
  exclude_multistorm: true
  years:                          # !! placeholders — keep in sync with train
    train: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009,
            2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019,
            2020]
    val:  [2021, 2022]
    test: [2023, 2024]

tags: [test-years, eval]          # -> wandb, with model tags

normalise:
  method: standardise
  stats: auto                     # this scenario HAS a train split (same
                                  # years as train.yaml) so auto works;
                                  # evaluation should still prefer the
                                  # TRAINING RUN's saved norm_stats.json
