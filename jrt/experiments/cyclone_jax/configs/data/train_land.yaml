# =============================================================================
# cyclone_jax data scenario: TRAIN_LAND — year-split training, LAND only
# =============================================================================
# Dataset variant of train.yaml (see it for the knobs' semantics): same
# splits/normalisation, sources restricted to the land network. pad_to
# stays 1536 across the land / marine / land+marine variants — the MLP
# input width is pad_to x F (features.flatten), so a shared pad_to keeps
# the architectures identical (fair comparison) and the jit shape single.

root: "E:/Caribbean-Obs"          # shell CYCLONE_JAX_ROOT overrides

sources: [land]
# explicit channel list = the sources' full union (the run-record
# default); trim it to ablate variables. Per-source absence (e.g.
# sst on land) stays NaN + missing-flag — no per-source selection.
channels: [station_pressure, slp, air_temp, dewpoint,
           u_wind, v_wind]
selection: all
max_stations: null
pad_to: 1536

target: usa_sshs
sshs_min: 3
class_set: [3, 4, 5, 6, 7, 8]
drop_subtropical: false

source_id: {land: -1, upper: 0, marine: 1}
timesteps: 1

batch_size: 32

num_workers: 0                    # shell CYCLONE_JAX_NUM_WORKERS overrides
prefetch_factor: 2

split:
  strategy: year
  exclude_multistorm: true
  years:                          # !! placeholders — set from the library
    train: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009,
            2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019,
            2020]
    val:  [2021, 2022]
    test: [2023, 2024]

tags: [year-split, land-only]

normalise:
  method: standardise
  stats: auto
