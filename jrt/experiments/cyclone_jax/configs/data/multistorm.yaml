# =============================================================================
# cyclone_jax data scenario: MULTISTORM — the OOD hard-test set
# =============================================================================
# All fixes at multi-driver timestamps (>1 qualifying storm active at once)
# — exactly the fixes the year splits exclude. Evaluation only; the split
# resolves to a single 'test' entry.

root: "E:/Caribbean-Obs"

sources: [land, marine]
# explicit channel list = the sources' full union (the run-record
# default); trim it to ablate variables. Per-source absence (e.g.
# sst on land) stays NaN + missing-flag — no per-source selection.
channels: [station_pressure, slp, air_temp, dewpoint, sst,
           u_wind, v_wind]
selection: all
max_stations: null
pad_to: 1536

target: usa_sshs
sshs_min: 3
class_set: [3, 4, 5, 6, 7, 8]
drop_subtropical: false

source_id: {land: -1, upper: 0, marine: 1}
timesteps: 1

batch_size: 32
split:
  strategy: multistorm

tags: [multistorm, ood]           # -> wandb, with model tags

normalise:
  method: standardise
  stats: auto                     # !! This scenario has NO train split, so
                                  # stats: auto FAILS at build_data — by
                                  # design. A stress test must name which
                                  # TRAINING distribution it is relative to:
                                  # paste that run's stats inline here, or
                                  # evaluate with --stats <run_dir> to reuse
                                  # its saved norm_stats.json.
