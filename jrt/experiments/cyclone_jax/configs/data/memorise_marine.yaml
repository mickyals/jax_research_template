# =============================================================================
# cyclone_jax data scenario: MEMORISE_MARINE — memorisation probe, MARINE only
# =============================================================================
# Dataset variant of memorise.yaml (see it for the probe's semantics and
# the train-yaml pairing notes): sources restricted to the marine network.
# The variant ladder (land / marine / land+marine) asks WHICH network the
# identifiability lives in. pad_to stays 1536 — shared MLP input width
# (pad_to x F) keeps capacities comparable across variants.

root: "E:/Caribbean-Obs"          # shell CYCLONE_JAX_ROOT overrides

sources: [marine]
# explicit channel list = the sources' full union (the run-record
# default); trim it to ablate variables. Per-source absence (e.g.
# sst on land) stays NaN + missing-flag — no per-source selection.
channels: [slp, air_temp, dewpoint, sst, u_wind, v_wind]
selection: all
max_stations: null
pad_to: 1536

target: usa_sshs
sshs_min: 3
class_set: [3, 4, 5, 6, 7, 8]
drop_subtropical: false

source_id: {land: -1, upper: 0, marine: 1}
timesteps: 1

batch_size: 32

num_workers: 0                    # shell CYCLONE_JAX_NUM_WORKERS overrides
prefetch_factor: 2

split:
  strategy: memorise              # train == val == ALL fixes
  exclude_multistorm: true

tags: [memorise, identifiability, marine-only]

storm_panels:
  train: random

normalise:
  method: standardise
  stats: auto
