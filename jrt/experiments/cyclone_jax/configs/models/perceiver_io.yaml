# =============================================================================
# cyclone_jax — MODEL config: Perceiver-IO (the model in mind)
# =============================================================================
# DRAFT — staged Perceiver-IO: Read (latents x station tokens) -> Processor
# (latent self-attention) -> Decoder (single query at the storm fix ->
# category logits). Token set = Station x [fourier(lat,lon) | obs | mask | ID],
# padded to data.pad_to (1536) with a station-validity mask.

model:
  name: perceiver_io
  num_latents: 128
  latent_dim: 256
  num_read_heads: 4
  num_processor_layers: 4
  num_processor_heads: 8
  num_decoder_heads: 4
  fourier_dim: 64              # spatial Fourier features over (lat, lon)
  fourier_scale: 1.0
  dropout_rate: 0.0            # OFF for the memorisation gate
  n_classes: 6                 # from data.class_set (TS+ 3..8)
