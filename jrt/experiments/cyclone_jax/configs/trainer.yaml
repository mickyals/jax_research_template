# =============================================================================
# cyclone_jax — TRAINER configuration
# =============================================================================
# DRAFT — values to be finalised at the first training step (Phase 6/7).
# The first goal is the memorisation gate: regularisation OFF, small fixed
# subset, drive train loss -> 0 (see plan: overfit which storms we can).

trainer:
  seed: 0

  loss: cross_entropy
  loss_kwargs: {}

  optimizer: adamw
  optimizer_kwargs:
    weight_decay: 0.0          # OFF for the memorisation gate

  scheduler: constant
  scheduler_kwargs:
    value: 1.0e-3

  num_epochs: 100
  check_val_every_n_epoch: 1
  gradient_clip: 1.0

  # Early stopping watches TRAIN loss during the memorisation gate
  patience: 50
  patience_metric: train/loss

  metrics: [cross_entropy, binary_accuracy, mae_class]

  logger: wandb                # wandb | tensorboard | "null"
  run_dir: runs/cyclone_jax/dev
