name: jrt

channels:
  - conda-forge
  - defaults

dependencies:
  - python>=3.12
  - pip

  - pip:
      # Core ML framework
      - jax>=0.10
      - jaxlib>=0.10
      - flax>=0.12
      - optax>=0.2
      - orbax-checkpoint>=0.11

      # Scientific computing
      - numpy>=2.0
      - scipy>=1.13

      # Data
      - pandas>=2.0
      - pillow>=10.0

      # Visualization
      - matplotlib>=3.9
      - seaborn>=0.13
      - plotly>=5.0

      # Notebooks
      - ipython>=8.0
      - ipykernel>=6.0

      # Development and testing
      - pytest>=9.0
      - pyyaml>=6.0
      - rich>=13.0
      - tqdm>=4.0

      # Hyperparameter optimization
      - optuna>=4.0

      # Optional -- install as needed
      # - wandb>=0.16
      # - torch>=2.0        # TensorBoardLogger only

      # GPU: jaxlib above installs CPU build. For GPU support:
      #   pip install --upgrade "jax[cuda12]"  # CUDA 12.x
      #   pip install --upgrade "jax[cuda11]"  # CUDA 11.x
      # See https://jax.readthedocs.io/en/latest/installation.html
